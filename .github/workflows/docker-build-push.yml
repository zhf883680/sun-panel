name: docker-push

on:
  workflow_dispatch:
  # 暂时取消自动编译，优化后重新开启
  # push:
  #   tags:
  #     - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from file
        id: read_version
        run: echo "APP_VERSION=$(cut -d '|' -f 2 ./service/assets/version)" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx 
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .  # 这里在项目根目录找Dockerfile构建
          platforms: linux/amd64,linux/arm,linux/arm64
          push: true
          # 前端版本号跟随 service/assets/version，和后端保持一致
          build-args: |
            VITE_APP_VERSION=${{ env.APP_VERSION }}
          tags: ${{ vars.DOCKER_IMAGE_NAME || 'zhf883680/sun-panel' }}:${{ env.APP_VERSION }}, ${{ vars.DOCKER_IMAGE_NAME || 'zhf883680/sun-panel' }}
